name: Rate Report -> WhatsApp

# 只由外部定时器（cron-job.org）在 13:00 UTC = 明斯克 16:00 调用 workflow_dispatch 触发。
# GitHub 自带的 schedule 会排队延迟 3-6 小时，已弃用。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rate-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send rate report
        env:
          KONTATO_API_KEY: ${{ secrets.KONTATO_API_KEY }}
          KONTATO_DESTS: '375259741332,375292238345'
        run: node scripts/rate-report.js
