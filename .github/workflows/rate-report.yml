name: Rate Report -> WhatsApp

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC = 白俄 15:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rate-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send rate report
        env:
          KONTATO_API_KEY: ${{ secrets.KONTATO_API_KEY }}
          KONTATO_DEST: '375292238345'
        run: node scripts/rate-report.js
