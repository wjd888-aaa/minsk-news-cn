name: Build & Deploy

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch & translate
        id: build
        run: node scripts/build.js
        timeout-minutes: 25

      - name: Commit new articles
        run: |
          git config user.name "wjd888-aaa"
          git config user.email "wjd888-aaa@users.noreply.github.com"
          git add articles
          git diff --cached --quiet || git commit -m "chore: update articles & deals"
          git push origin main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4